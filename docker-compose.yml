version: "3.9"

services:
  elident-bot:
    build: .
    container_name: elident-bot
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ./tokens.json:/app/tokens.json
      - ./data:/app/data
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - DB_FILE=data/conversations.db
